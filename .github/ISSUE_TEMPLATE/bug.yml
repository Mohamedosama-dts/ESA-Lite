name: Bug
description: Something in the UI, CLI, or packaging does not work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include PINs or private key material.
  - type: input
    id: version
    attributes:
      label: ESA-Lite version
      placeholder: e.g. 2.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - UI
        - CLI
        - Installer / packaged EXE
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
