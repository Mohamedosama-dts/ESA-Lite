<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* خلفية أولية ذكية تتوافق مع وضع النظام لمنع الوميض الأبيض */
        html, body, #app {
            background-color: #f8fafc;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        /* إذا كان النظام في الوضع الداكن، نغير اللون فوراً قبل تحميل Vue */
        @media (prefers-color-scheme: dark) {
            :root:not(.light) body, 
            html.dark body { background-color: #111827; }
        }
    </style>
    <script>
        // فخ لاصطياد الأخطاء المبكرة قبل تحميل Vue
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            var message = "JavaScript Error: " + msg + "\n" + "Line: " + lineNo + "\n" + "File: " + url;
            alert(message);
            return false;
        };
    </script>
    <title>ESA Lite</title>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
